[package]
name = "cdp-driver"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Chrome DevTools Protocol (CDP) client for Rust: every command, event and type generated from the schema, with sessions, for browser automation and AI agents"
authors = ["Rakibul Yeasin <ryeasin03@gmail.com>"]
license = "MIT"
repository = "https://github.com/dreygur/cdp-protocol"
documentation = "https://docs.rs/cdp-driver"
readme = "README.md"
keywords = ["cdp", "chrome", "devtools", "browser-automation", "headless"]
categories = ["web-programming", "api-bindings", "development-tools::testing", "asynchronous"]

[features]
blocking = []

[[example]]
name = "basic"

[[example]]
name = "agent"

[[example]]
name = "industrial"

[[example]]
name = "cluster"

[[example]]
name = "raw"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
base64 = "0.23"
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
