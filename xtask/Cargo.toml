[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Repository automation: regenerates the CDP method-name constants"

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
